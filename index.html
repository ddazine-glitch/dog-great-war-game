<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#87ceeb">
<title>멍멍 대전쟁</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="screen-title" class="screen active">
    <h1>🐶 멍멍 대전쟁 🐱</h1>
    <p class="subtitle">강아지 아군 vs 고양이 적군</p>
    <button id="btn-start" class="big-btn">게임 시작</button>
  </section>

  <section id="screen-stageselect" class="screen">
    <h2>스테이지 선택</h2>
    <div id="world-tabs" class="world-tabs"></div>
    <div id="stage-grid" class="stage-grid"></div>
    <div id="world-boss-row"></div>
    <div id="page-nav" class="page-nav"></div>
    <div class="row-buttons">
      <button id="btn-open-roster" class="mid-btn">🍎 강아지 부대 강화</button>
      <button id="btn-open-gacha" class="mid-btn">🎴 카드 뽑기</button>
      <button id="btn-open-pvp" class="mid-btn">⚔️ 코드 대전</button>
      <button id="btn-open-traits" class="mid-btn">✨ 특성 정보</button>
      <button id="btn-back-title" class="mid-btn ghost">처음으로</button>
    </div>
  </section>

  <section id="screen-traits" class="screen">
    <h2>✨ 특성 정보</h2>
    <p class="subtitle">캐릭터를 6단계까지 강화하면 특성이 생겨요. 강한 속성 상대에게는 더 큰 피해, 약한 속성 상대에게는 피해를 덜 주고 더 많이 맞아요.</p>
    <div id="trait-list" class="trait-list"></div>
    <button id="btn-traits-back" class="mid-btn">뒤로</button>
  </section>

  <section id="screen-pvp" class="screen">
    <h2>⚔️ 코드 대전</h2>
    <p class="subtitle">서버 없이, 코드를 주고받아서 내 부대 vs 상대 부대로 대결해요</p>
    <div class="pvp-box">
      <div class="name">1. 내 코드 (친구에게 보내주세요)</div>
      <textarea id="pvp-my-code" class="pvp-code" readonly rows="3"></textarea>
      <button id="btn-pvp-copy" class="mid-btn">📋 복사하기</button>
    </div>
    <div class="pvp-box">
      <div class="name">2. 상대 코드 입력하고 대결 시작</div>
      <textarea id="pvp-opp-code" class="pvp-code" rows="3" placeholder="상대가 보내준 코드를 여기에 붙여넣기"></textarea>
      <button id="btn-pvp-fight" class="big-btn">⚔️ 대결 시작!</button>
      <p id="pvp-error" class="pvp-error"></p>
    </div>
    <button id="btn-pvp-back" class="mid-btn">뒤로</button>
  </section>

  <section id="screen-gacha" class="screen">
    <h2>🎴 카드 뽑기</h2>
    <p id="gacha-card-count" class="subtitle"></p>
    <button id="btn-gacha-pull" class="big-btn">뽑기 (카드 1개)</button>
    <div id="gacha-result"></div>
    <div id="gacha-gallery" class="gacha-gallery"></div>
    <button id="btn-gacha-back" class="mid-btn">뒤로</button>
  </section>

  <section id="screen-roster" class="screen">
    <h2>강아지 부대 강화</h2>
    <div id="fruit-bar" class="fruit-bar"></div>
    <div id="upgrade-box" class="upgrade-box"></div>
    <div id="roster-list" class="roster-list"></div>
    <button id="btn-roster-back" class="mid-btn">뒤로</button>
  </section>

  <section id="screen-battle" class="screen">
    <div id="battle-hud">
      <div class="hp-block left">
        <span class="hp-label">😾 고양이 기지</span>
        <div class="hp-bar"><div id="enemy-hp-fill" class="hp-fill enemy"></div></div>
      </div>
      <div class="mid-info">
        <div id="stage-label">1-1</div>
        <div id="money-label">💰 0</div>
      </div>
      <div class="hp-block right">
        <span class="hp-label">🐶 강아지 기지</span>
        <div class="hp-bar"><div id="player-hp-fill" class="hp-fill player"></div></div>
      </div>
      <button id="btn-exit-battle" class="exit-btn">✕</button>
    </div>

    <canvas id="game-canvas" width="1120" height="460"></canvas>

    <div id="control-ui">
      <span id="control-hint">🐾 아군 캐릭터를 탭해서 골라보세요</span>
      <button id="btn-move-back">◀</button>
      <button id="btn-jump">⤴️ 점프</button>
      <button id="btn-move-fwd">▶</button>
    </div>

    <div id="item-ui">
      <button id="btn-item-speed" class="item-btn">⚡ 2배속</button>
      <button id="btn-item-atk" class="item-btn">💥 공격 2배</button>
      <button id="btn-item-gold" class="item-btn">💰 골드 2배</button>
    </div>

    <div id="cannon-ui">
      <span id="cannon-label">🐶💥 대포 충전중</span>
      <div id="cannon-bar"><div id="cannon-fill"></div></div>
      <button id="btn-autospawn">🔁 자동 소환 OFF</button>
    </div>

    <div id="unit-bar"></div>
  </section>

  <div id="result-overlay" class="overlay hidden">
    <div class="result-box">
      <h2 id="result-title">승리!</h2>
      <p id="result-desc"></p>
      <button id="btn-result-continue" class="big-btn">계속</button>
    </div>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
